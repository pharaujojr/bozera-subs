<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bozera Subs</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <meta name="theme-color" content="#090b0f">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #090b0f;
      --surface: #10141b;
      --surface-raised: #161b24;
      --border: #1f2631;
      --accent: #4c8dff;
      --accent-dim: #2b5fb8;
      --text: #eef2f8;
      --muted: #94a0b2;
      --muted-2: #5f6b7d;
      --danger: #f0525b;
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    html { color-scheme: dark; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(180deg, #10141b, #0c0f14);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .mark { width: 32px; height: 32px; flex: none; display: block; filter: drop-shadow(0 3px 8px rgba(76, 141, 255, 0.45)); }
    .brand-title { font-size: 1.05rem; letter-spacing: -0.02em; white-space: nowrap; }
    .brand-title b { font-weight: 700; }
    .brand-title span { font-weight: 400; color: var(--muted); }

    .app-nav { display: flex; gap: 2px; flex-shrink: 0; }
    .app-nav a {
      padding: 7px 12px;
      border-radius: 7px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.15s, background 0.15s;
    }
    .app-nav a:hover { color: var(--text); background: var(--surface-raised); }
    .app-nav a.active { color: var(--text); background: var(--surface-raised); }

    .lib-tabs {
      min-width: 0;
      display: flex;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .lib-tabs::-webkit-scrollbar { display: none; }

    .lib-tab {
      padding: 7px 14px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.82rem;
      font-family: var(--font);
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    .lib-tab:hover { color: var(--text); background: var(--surface-raised); }
    .lib-tab.active { color: var(--accent); background: rgba(76, 141, 255, 0.1); }
    .lib-tab.unavailable { opacity: 0.35; cursor: not-allowed; }

    .search-wrap {
      margin-left: auto;
      position: relative;
      flex-shrink: 0;
    }
    .search-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-2);
      pointer-events: none;
    }

    #search {
      padding: 8px 12px 8px 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0c0f14;
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--font);
      width: 220px;
      outline: none;
      transition: border-color 0.15s, width 0.2s;
    }
    #search:focus { border-color: var(--accent-dim); width: 260px; }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s;
    }
    .icon-btn:hover { color: var(--danger); border-color: var(--danger); }

    /* ── Main ── */
    main { max-width: 1400px; margin: 0 auto; padding: 28px 24px 60px; }

    .stats {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 18px;
    }

    /* ── Poster grid ── */
    #movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
    }

    .poster-card {
      cursor: pointer;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .poster-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-dim);
      box-shadow: 0 16px 32px -12px rgba(0, 0, 0, 0.6);
    }

    .poster-art {
      position: relative;
      aspect-ratio: 2 / 3;
      background: var(--surface-raised);
      overflow: hidden;
    }

    .poster-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s ease;
    }

    .poster-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      background: linear-gradient(160deg, #161b24, #0c0f14);
      color: var(--muted-2);
      text-align: center;
    }
    .poster-fallback span {
      font-size: 0.74rem;
      line-height: 1.3;
      color: var(--muted);
      font-weight: 500;
    }

    .poster-meta {
      padding: 10px 11px 12px;
    }

    .poster-title {
      font-size: 0.83rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .poster-file {
      font-size: 0.7rem;
      color: var(--muted-2);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Loading skeletons ── */
    .skeleton {
      background: linear-gradient(100deg, var(--surface) 30%, var(--surface-raised) 50%, var(--surface) 70%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 10px;
      aspect-ratio: 2 / 3;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 32px;
      justify-content: center;
    }
    .btn-page {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-family: var(--font);
      font-size: 0.82rem;
      transition: border-color 0.15s;
    }
    .btn-page:hover:not(:disabled) { border-color: var(--accent-dim); }
    .btn-page:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-info { color: var(--muted); font-size: 0.82rem; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 90px 20px;
      color: var(--muted);
    }
    .empty-state svg { color: var(--muted-2); margin-bottom: 14px; }
    .empty-state p { font-size: 0.88rem; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      header { padding: 0 14px; gap: 10px; }
      .brand-title { display: none; }
      #search { width: 92px; }
      #search:focus { width: 120px; }
      .app-nav a { padding: 7px 8px; }
      main { padding: 18px 14px 40px; }
      #movie-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
      .poster-title { font-size: 0.76rem; }
      .poster-file { font-size: 0.65rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <img class="mark" src="/assets/logo.svg" alt="">
    <span class="brand-title"><b>Bozera</b> <span>Subs</span></span>
  </div>
  <nav class="app-nav" aria-label="Seções">
    <a class="active" href="/" aria-current="page">Biblioteca</a>
    <a href="/painel">Painel</a>
  </nav>
  <div class="lib-tabs" id="lib-tabs"></div>
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input type="search" id="search" placeholder="Buscar filme…">
  </div>
  <button class="icon-btn" onclick="logout()" title="Sair">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div id="movie-grid"></div>
  <div class="pagination" id="pagination" style="display:none"></div>
</main>

<script>
const PER_PAGE = 60;
let currentLibrary = '';
let currentSearch = '';
let currentPage = 1;
let searchTimer = null;

async function api(path) {
  const res = await fetch(path, { credentials: 'include' });
  if (res.status === 401) { window.location.href = '/login'; throw new Error('unauthorized'); }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function logout() {
  await fetch('/api/logout', { method: 'POST', credentials: 'include' });
  window.location.href = '/login';
}

// ── Libraries ──────────────────────────────────────────────────────────────
async function loadLibraries() {
  const libs = await api('/api/libraries');
  const container = document.getElementById('lib-tabs');

  const allTab = document.createElement('button');
  allTab.className = 'lib-tab active';
  allTab.textContent = 'Todas';
  allTab.addEventListener('click', () => selectLibrary('', allTab));
  container.appendChild(allTab);

  libs.forEach(lib => {
    const btn = document.createElement('button');
    btn.className = 'lib-tab' + (lib.accessible ? '' : ' unavailable');
    btn.textContent = lib.name;
    btn.title = lib.path;
    if (lib.accessible) btn.addEventListener('click', () => selectLibrary(lib.path, btn));
    container.appendChild(btn);
  });
}

function selectLibrary(path, btn) {
  currentLibrary = path;
  currentPage = 1;
  document.querySelectorAll('.lib-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  loadMovies();
}

// ── Movies ─────────────────────────────────────────────────────────────────
function renderSkeletons() {
  const grid = document.getElementById('movie-grid');
  grid.innerHTML = '';
  for (let i = 0; i < 18; i++) {
    const sk = document.createElement('div');
    sk.className = 'skeleton';
    grid.appendChild(sk);
  }
}

async function loadMovies() {
  renderSkeletons();
  document.getElementById('pagination').style.display = 'none';

  const params = new URLSearchParams({
    page: currentPage,
    per_page: PER_PAGE,
    ...(currentLibrary && {library: currentLibrary}),
    ...(currentSearch && {search: currentSearch}),
  });

  const data = await api(`/api/movies?${params}`);

  document.getElementById('stats').textContent =
    `${data.total} título(s) — página ${data.page} de ${Math.ceil(data.total / PER_PAGE) || 1}`;

  const grid = document.getElementById('movie-grid');
  grid.innerHTML = '';

  if (!data.videos.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <p>${currentSearch ? 'Nenhum resultado para "' + esc(currentSearch) + '"' : 'Nenhum vídeo encontrado'}</p>
    </div>`;
    return;
  }

  data.videos.forEach(v => grid.appendChild(buildPosterCard(v)));
  renderPagination(data.total, data.page);
}

function buildPosterCard(video) {
  const card = document.createElement('div');
  card.className = 'poster-card';

  card.innerHTML = `
    <div class="poster-art">
      <div class="poster-fallback" data-fallback>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="18" rx="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 8h20M7 3v5M17 3v5" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>${esc(video.title)}</span>
      </div>
      <img loading="lazy" style="opacity:0" data-poster-img>
    </div>
    <div class="poster-meta">
      <div class="poster-title">${esc(video.title)}</div>
      <div class="poster-file">${esc(video.name)}</div>
    </div>`;

  const img = card.querySelector('[data-poster-img]');
  const fallback = card.querySelector('[data-fallback]');
  img.src = '/api/artwork?video_path=' + encodeURIComponent(video.path);
  img.addEventListener('load', () => { img.style.opacity = '1'; fallback.style.display = 'none'; });
  img.addEventListener('error', () => {
    const url = img.src;
    img.remove();
    fetch(url, { credentials: 'include' })
      .then(res => {
        if (!res.ok) {
          console.error(`[artwork] falhou (${res.status}) para "${video.title}":`, url);
          return res.text().then(t => console.error('[artwork] resposta:', t));
        }
        console.error(`[artwork] fetch OK (${res.status}) mas <img> falhou para "${video.title}" — possível bloqueio de conteúdo misto/CSP/extensão.`, url);
      })
      .catch(err => console.error(`[artwork] erro de rede para "${video.title}":`, err, url));
  });

  card.addEventListener('click', () => {
    window.location.href = '/player?video=' + encodeURIComponent(video.path);
  });

  return card;
}

// ── Pagination ─────────────────────────────────────────────────────────────
function renderPagination(total, page) {
  const totalPages = Math.ceil(total / PER_PAGE);
  const container = document.getElementById('pagination');
  if (totalPages <= 1) { container.style.display = 'none'; return; }

  container.style.display = 'flex';
  container.innerHTML = `
    <button class="btn-page" id="prev-btn" ${page === 1 ? 'disabled' : ''}>← Anterior</button>
    <span class="page-info">Página ${page} de ${totalPages}</span>
    <button class="btn-page" id="next-btn" ${page >= totalPages ? 'disabled' : ''}>Próxima →</button>`;

  container.querySelector('#prev-btn').addEventListener('click', () => {
    currentPage--; window.scrollTo(0,0); loadMovies();
  });
  container.querySelector('#next-btn').addEventListener('click', () => {
    currentPage++; window.scrollTo(0,0); loadMovies();
  });
}

// ── Search ─────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentSearch = e.target.value.trim();
    currentPage = 1;
    loadMovies();
  }, 350);
});

// ── Utils ──────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Init ───────────────────────────────────────────────────────────────────
(async () => {
  await loadLibraries();
  await loadMovies();
})();
</script>
</body>
</html>
